<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natų skaitymo čempionatas</title>
  <!-- Подключение React, Babel (для JSX) и Tailwind CSS -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const OCTAVES = [
      { id: 'all', name: 'Visos oktavos', icon: '🎵' },
      { id: 'didzioji', name: 'Didžioji oktava', icon: '🎻' },
      { id: 'mazoji', name: 'Mažoji oktava', icon: '🎸' },
      { id: 'pirmoji', name: 'Pirmoji oktava', icon: '🎹' },
      { id: 'antroji', name: 'Antroji oktava', icon: '🎺' }
    ];

    const playSound = (freq, type = 'sine', duration = 0.15) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    };

    function App() {
      const [records, setRecords] = useState(() => {
        try {
          const saved = localStorage.getItem('notes_championship_records_v5');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      const [studentName, setStudentName] = useState('');
      const [selectedOctave, setSelectedOctave] = useState('pirmoji');
      const [filterOctave, setFilterOctave] = useState('pirmoji');

      const [gameState, setGameState] = useState('idle');
      const [countdown, setCountdown] = useState(3);
      const [time, setTime] = useState(0);
      const [lastRecordedTime, setLastRecordedTime] = useState(null);
      const [feedbackMessage, setFeedbackMessage] = useState(null);

      const [showManualModal, setShowManualModal] = useState(false);
      const [manualName, setManualName] = useState('');
      const [manualOctave, setManualOctave] = useState('pirmoji');
      const [manualSeconds, setManualSeconds] = useState('');

      const [editingId, setEditingId] = useState(null);
      const [editName, setEditName] = useState('');
      const [editOctave, setEditOctave] = useState('pirmoji');
      const [editSeconds, setEditSeconds] = useState('');

      const timerRef = useRef(null);
      const startTimeRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem('notes_championship_records_v5', JSON.stringify(records));
        } catch (e) {}
      }, [records]);

      useEffect(() => {
        let interval = null;
        if (gameState === 'countdown') {
          if (countdown > 0) {
            playSound(440 + (3 - countdown) * 110, 'sine', 0.12);
            interval = setInterval(() => setCountdown((c) => c - 1), 1000);
          } else {
            playSound(880, 'triangle', 0.3);
            setGameState('running');
            startTimeRef.current = Date.now();
            timerRef.current = setInterval(() => {
              setTime(Date.now() - startTimeRef.current);
            }, 10);
          }
        }
        return () => clearInterval(interval);
      }, [gameState, countdown]);

      const handleStartTimer = (e) => {
        e.preventDefault();
        if (!studentName.trim()) return;
        setFeedbackMessage(null);
        setTime(0);
        setLastRecordedTime(null);
        setCountdown(3);
        setGameState('countdown');
      };

      const handleStopTimer = () => {
        clearInterval(timerRef.current);
        const finalTime = Date.now() - startTimeRef.current;
        setTime(finalTime);
        setLastRecordedTime(finalTime);
        setGameState('review');
        playSound(523.25, 'sine', 0.25);
      };

      const confirmTimerRecord = () => {
        saveOrUpdateRecord(studentName.trim(), selectedOctave, lastRecordedTime);
        setGameState('idle');
        setTime(0);
      };

      const getOctaveRanks = (allRecords, octave) => {
        const octaveItems = allRecords
          .filter((r) => r.octave === octave)
          .sort((a, b) => a.time - b.time);
        
        const rankMap = {};
        octaveItems.forEach((item, index) => {
          rankMap[item.id] = index + 1;
        });
        return rankMap;
      };

      const saveOrUpdateRecord = (name, octave, newTime, customEditId = null) => {
        const targetEditId = customEditId || editingId;
        const oldRanks = getOctaveRanks(records, octave);

        const filtered = records.filter(r => r.id !== targetEditId);
        const existingRecord = filtered.find(
          (r) => r.name.toLowerCase() === name.toLowerCase() && r.octave === octave
        );

        if (existingRecord && !targetEditId) {
          if (newTime >= existingRecord.time) {
            setFeedbackMessage({
              type: 'warning',
              text: `Ankstesnis ${name} rekordas (${formatTime(existingRecord.time)}) buvo greitesnis! Naujas rezultatas neišsaugotas.`
            });
            return;
          }

          const diffMs = existingRecord.time - newTime;
          const prevRank = oldRanks[existingRecord.id];

          const updatedRecords = records.map((r) => {
            if (r.id === existingRecord.id) {
              return {
                ...r,
                time: newTime,
                date: new Date().toLocaleDateString('lt-LT'),
                timeDiffMs: diffMs,
                previousRank: prevRank
              };
            }
            return r;
          });

          setRecords(updatedRecords);
          setFeedbackMessage({
            type: 'success',
            text: `Puiku! ${name} pagerino savo rekordą -${(diffMs / 1000).toFixed(2)} s greičiau!`
          });
        } else {
          const diffMs = existingRecord ? existingRecord.time - newTime : null;
          const prevRank = existingRecord ? oldRanks[existingRecord.id] : null;

          const newRecord = {
            id: targetEditId || Date.now().toString(),
            name,
            octave,
            time: newTime,
            date: new Date().toLocaleDateString('lt-LT'),
            previousRank: prevRank,
            timeDiffMs: diffMs
          };

          const otherRecords = filtered.filter(
            r => !(r.name.toLowerCase() === name.toLowerCase() && r.octave === octave)
          );

          setRecords([...otherRecords, newRecord]);
          setFeedbackMessage({
            type: 'success',
            text: `${name} rezultatas išsaugotas!`
          });
        }

        setFilterOctave(octave);
      };

      const handleDeleteRecord = (id) => {
        if (confirm('Ar tikrai norite ištrinti šį įrašą?')) {
          setRecords(records.filter((r) => r.id !== id));
        }
      };

      const handleClearAll = () => {
        if (confirm('Ar tikrai norite ištrinti visus rezultatus?')) {
          setRecords([]);
          localStorage.removeItem('notes_championship_records_v5');
        }
      };

      const formatTime = (ms) => {
        if (ms === null || ms === undefined) return '0.00 s';
        const seconds = Math.floor(ms / 1000);
        const hundredths = Math.floor((ms % 1000) / 10);
        return `${seconds}.${hundredths < 10 ? '0' : ''}${hundredths} s`;
      };

      const currentFilteredRecords = records
        .filter((r) => filterOctave === 'all' || r.octave === filterOctave)
        .sort((a, b) => a.time - b.time);

      const top3 = currentFilteredRecords.slice(0, 3);
      const rest = currentFilteredRecords.slice(3);

      return (
        <div className="max-w-5xl mx-auto px-4 py-8">
          <header className="text-center mb-8">
            <h1 className="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-indigo-200 to-emerald-400">
              Natų skaitymo čempionatas
            </h1>
          </header>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            <div className="lg:col-span-5 flex flex-col gap-6">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl">
                <h2 className="text-xl font-bold text-slate-200 mb-4">⏱️ Sekundometras</h2>

                {gameState === 'idle' && (
                  <form onSubmit={handleStartTimer} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-400 mb-1">Mokinio vardas</label>
                      <input
                        type="text"
                        required
                        placeholder="pvz., Liepa"
                        value={studentName}
                        onChange={(e) => setStudentName(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-100"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-400 mb-1">Oktava</label>
                      <div className="grid grid-cols-2 gap-2">
                        {OCTAVES.filter((o) => o.id !== 'all').map((o) => (
                          <button
                            key={o.id}
                            type="button"
                            onClick={() => setSelectedOctave(o.id)}
                            className={`p-2.5 rounded-xl text-xs font-semibold border ${
                              selectedOctave === o.id
                                ? 'bg-indigo-600/30 border-indigo-500 text-indigo-200'
                                : 'bg-slate-950 border-slate-800 text-slate-400'
                            }`}
                          >
                            {o.icon} {o.name}
                          </button>
                        ))}
                      </div>
                    </div>
                    <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold py-4 rounded-xl text-lg">
                      Pasirengti ir Pradėti! 🚀
                    </button>
                  </form>
                )}

                {gameState === 'countdown' && (
                  <div className="text-center py-8 text-7xl font-black text-amber-400">{countdown}</div>
                )}

                {gameState === 'running' && (
                  <div className="text-center py-6">
                    <div className="text-6xl font-mono font-bold text-emerald-400 mb-6">{formatTime(time)}</div>
                    <button onClick={handleStopTimer} className="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-5 rounded-2xl text-xl">
                      SUSTABDYTI 🛑
                    </button>
                  </div>
                )}

                {gameState === 'review' && (
                  <div className="text-center py-4 space-y-4">
                    <div className="text-5xl font-mono font-black text-indigo-300">{formatTime(lastRecordedTime)}</div>
                    <div className="flex gap-2">
                      <button onClick={confirmTimerRecord} className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl">
                        ✅ Išsaugoti
                      </button>
                      <button onClick={() => setGameState('idle')} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3.5 rounded-xl">
                        ❌ Atmesti
                      </button>
                    </div>
                  </div>
                )}
              </div>

              <button
                onClick={() => setShowManualModal(true)}
                className="w-full bg-slate-900 border border-indigo-500/30 hover:bg-slate-800 text-indigo-300 font-bold py-3.5 rounded-2xl"
              >
                ➕ Pridėti rezultatą rankiniu būdu
              </button>
            </div>

            <div className="lg:col-span-7">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-2xl font-bold text-slate-200">🏆 Lyderių lentelė</h2>
                  {records.length > 0 && (
                    <button onClick={handleClearAll} className="text-xs text-rose-400

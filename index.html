<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Natų skaitymo čempionatas</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230f172a%22/><text x=%2210%22 y=%22.9em%22 font-size=%2280%22>🎵</text></svg>">
  <style>
    :root {
      --bg-dark: #020617;
      --bg-card: #0f172a;
      --bg-card-inner: #020617;
      --border: #1e293b;
      --border-input: #334155;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --indigo: #4f46e5;
      --indigo-hover: #6366f1;
      --indigo-light: #a5b4fc;
      --emerald: #10b981;
      --emerald-dark: #059669;
      --amber: #fbbf24;
      --rose: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient glows */
    .glow-1 {
      position: fixed;
      top: -120px;
      left: -120px;
      width: 320px;
      height: 320px;
      background: rgba(79, 70, 229, 0.14);
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      z-index: 0;
    }

    .glow-2 {
      position: fixed;
      top: 35%;
      right: -120px;
      width: 320px;
      height: 320px;
      background: rgba(147, 51, 234, 0.14);
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1024px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .badge-top {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(30, 27, 75, 0.8);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    h1 {
      font-size: 2rem;
      font-weight: 900;
      line-height: 1.15;
      background: linear-gradient(to right, #fcd34d, #c7d2fe, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      max-width: 520px;
      line-height: 1.45;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (min-width: 900px) {
      h1 { font-size: 2.8rem; }
      .grid { grid-template-columns: 5fr 7fr; }
    }

    .card {
      background-color: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.6);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      background-color: var(--bg-dark);
      border: 1px solid var(--border-input);
      border-radius: 12px;
      padding: 13px 14px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--indigo);
    }

    button {
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--indigo), #6366f1);
      color: white;
      padding: 15px;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
    }

    .btn-stop {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #34d399);
      color: #020617;
      padding: 18px;
      font-size: 1.25rem;
      font-weight: 900;
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.35);
    }

    .btn-secondary {
      width: 100%;
      background-color: #1e293b;
      color: #e2e8f0;
      padding: 14px;
      font-size: 1rem;
      margin-top: 12px;
    }

    .timer-box {
      text-align: center;
      padding: 16px 0;
    }

    .active-student-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: #1e293b;
      color: var(--indigo-light);
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .countdown-num {
      font-size: 5rem;
      font-weight: 900;
      color: var(--amber);
      line-height: 1;
      padding: 16px 0;
    }

    .timer-digits {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 3.25rem;
      font-weight: 800;
      color: #34d399;
      margin-bottom: 20px;
    }

    .finished-digits {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 2.75rem;
      font-weight: 800;
      color: var(--indigo-light);
      margin-bottom: 8px;
    }

    .feedback-banner {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .feedback-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .feedback-warning {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fcd34d;
    }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .tab-btn {
      padding: 7px 11px;
      border-radius: 10px;
      font-size: 0.82rem;
      background-color: #1e293b;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tab-btn.active {
      background-color: var(--indigo);
      color: white;
    }

    .score-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .score-item {
      padding: 14px 16px;
      border-radius: 14px;
      background-color: var(--bg-card-inner);
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .score-item.top-1 {
      border-color: rgba(251, 191, 36, 0.5);
      background: linear-gradient(90deg, rgba(251, 191, 36, 0.08), rgba(2, 6, 23, 1));
    }

    .score-item.top-2 {
      border-color: rgba(148, 163, 184, 0.4);
    }

    .score-item.top-3 {
      border-color: rgba(217, 119, 6, 0.4);
    }

    .player-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .rank-badge {
      font-size: 1.5rem;
      font-weight: 800;
      min-width: 32px;
      text-align: center;
      color: var(--text-muted);
    }

    .player-details {
      min-width: 0;
    }

    .player-name {
      font-size: 1.1rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .player-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .time-block {
      text-align: right;
    }

    .time-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--indigo-light);
    }

    .improve-tag {
      font-size: 0.72rem;
      color: #34d399;
      font-weight: 700;
    }

    .btn-del {
      background: rgba(244, 63, 94, 0.12);
      color: #fda4af;
      padding: 7px 9px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .btn-clear {
      background: transparent;
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fda4af;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
      font-size: 0.92rem;
      border: 1px dashed var(--border);
      border-radius: 14px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="container">
    <header>
      <div class="badge-top">🎵 Muzikos pamokos žaidimas</div>
      <h1>Natų skaitymo čempionatas</h1>
      <p class="subtitle">

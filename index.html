<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Natų čempionatas</title>
  
  <!-- Настройки для запуска как отдельное приложение -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230f172a%22/><text x=%2210%22 y=%22.9em%22 font-size=%2280%22>🎵</text></svg>">

  <script src="https://unpkg.com"></script>
  <script src="https://unpkg.com"></script>
  <script src="https://unpkg.com"></script>
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen select-none">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const OCTAVES = [
      { id: 'all', name: 'Visos oktavos', icon: '🎵' },
      { id: 'didzioji', name: 'Didžioji oktava', icon: '🎻' },
      { id: 'mazoji', name: 'Mažoji oktava', icon: '🎸' },
      { id: 'pirmoji', name: 'Pirmoji oktava', icon: '🎹' },
      { id: 'antroji', name: 'Antroji oktava', icon: '🎺' }
    ];

    function App() {
      const [scores, setScores] = useState(() => {
        try {
          const saved = localStorage.getItem('music_game_scores_v4');
          return saved ? JSON.parse(saved) : [];
        } catch (e) { return []; }
      });
      const [name, setName] = useState('');
      const [octave, setOctave] = useState('pirmoji');
      const [selectedTab, setSelectedTab] = useState('pirmoji');
      const [status, setStatus] = useState('idle');
      const [countdown, setCountdown] = useState(3);
      const [time, setTime] = useState(0);
      const [showManualModal, setShowManualModal] = useState(false);
      const [manualName, setManualName] = useState('');
      const [manualOctave, setManualOctave] = useState('pirmoji');
      const [manualSeconds, setManualSeconds] = useState('');
      const [editingScore, setEditingScore] = useState(null);
      const timerRef = useRef(null);
      const startTimeRef = useRef(null);

      useEffect(() => {
        try { localStorage.setItem('music_game_scores_v4', JSON.stringify(scores)); } catch (e) {}
      }, [scores]);

      useEffect(() => {
        let interval = null;
        if (status === 'countdown') {
          if (countdown > 0) {
            interval = setInterval(() => setCountdown(c => c - 1), 1000);
          } else {
            setStatus('running');
            startTimeRef.current = Date.now();
            timerRef.current = setInterval(() => setTime(Date.now() - startTimeRef.current), 10);
          }
        }
        return () => clearInterval(interval);
      }, [status, countdown]);

      const startSequence = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        setTime(0);
        setCountdown(3);
        setStatus('countdown');
      };

      const stopTimer = () => {
        clearInterval(timerRef.current);
        setTime(Date.now() - startTimeRef.current);
        setStatus('review');
      };

      const confirmTimerScore = () => {
        saveOrUpdateScore(name.trim(), octave, time);
        setStatus('idle');
        setTime(0);
      };

      const saveOrUpdateScore = (playerName, playerOctave, timeMs, editId = null) => {
        setScores(prevScores => {
          const filtered = prevScores.filter(s => s.id !== editId);
          const octaveScores = filtered.filter(s => s.octave === playerOctave).sort((a, b) => a.timeMs - b.timeMs);
          const existingIndex = octaveScores.findIndex(s => s.name.toLowerCase() === playerName.toLowerCase());
          let oldTimeMs = null;
          let oldRank = null;
          if (existingIndex !== -1) {
            oldTimeMs = octaveScores[existingIndex].timeMs;
            oldRank = existingIndex + 1;
          }
          if (oldTimeMs !== null && timeMs >= oldTimeMs && !editId) {
            alert(`ℹ️ Pastaba: ${playerName} jau turi geresnį rezultatą (${(oldTimeMs/1000).toFixed(2)} s). Naujas lėtesnis laikas nebuvo išsaugotas.`);
            return prevScores;
          }
          const timeImprovedMs = oldTimeMs !== null ? oldTimeMs - timeMs : null;
          const otherScores = filtered.filter(s => !(s.name.toLowerCase() === playerName.toLowerCase() && s.octave === playerOctave));
          const updatedOctaveList = [...otherScores.filter(s => s.octave === playerOctave), { timeMs }].sort((a, b) => a.timeMs - b.timeMs);
          const newRank = updatedOctaveList.findIndex(s => s.timeMs === timeMs) + 1;
          const rankChange = oldRank !== null ? oldRank - newRank : null;
          const newEntry = {
            id: editId || Date.now().toString(),
            name: playerName,
            octave: playerOctave,
            timeMs,
            date: new Date().toLocaleDateString('lt-LT'),
            rankChange,
            timeImprovedMs
          };
          return [...otherScores, newEntry];
        });
      };

      const formatTime = (ms) => {
        const seconds = Math.floor(ms / 1000);
        const hundredths = Math.floor((ms % 1000) / 10);
        return `${seconds}.${hundredths < 10 ? '0' : ''}${hundredths} s`;
      };

      const filteredScores = scores.filter(s => selectedTab === 'all' || s.octave === selectedTab).sort((a, b) => a.timeMs - b.timeMs);
      const top3 = filteredScores.slice(0, 3);
      const rest = filteredScores.slice(3);

      return (
        <div className="max-w-5xl mx-auto px-4 py-6">
          <header className="text-center mb-6">
            <h1 className="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-indigo-200 to-emerald-400">
              Natų skaitymo čempionatas
            </h1>
          </header>
          <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
            <div className="md:col-span-5 flex flex-col gap-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <h2 className="text-xl font-bold text-slate-200 mb-3">⏱️ Sekundometras</h2>
                {status === 'idle' && (
                  <form onSubmit={startSequence} className="flex flex-col gap-3">
                    <div>
                      <label className="text-xs font-semibold text-slate-400">Mokinio vardas</label>
                      <input type="text" required placeholder="Įveskite vardą..." value={name} onChange={e => setName(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100" />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-400">Oktava</label>
                      <select value={octave} onChange={e => setOctave(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100">
                        {OCTAVES.filter(o => o.id !== 'all').map(o => <option key={o.id} value={o.id}>{o.icon} {o.name}</option>)}
                      </select>
                    </div>
                    <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl text-lg">Pradėti 🚀</button>
                  </form>
                )}
                {status === 'countdown' && <div className="text-center py-6 text-6xl font-black text-amber-400">{countdown}</div>}
                {status === 'running' && (
                  <div className="text-center py-4">
                    <div className="text-5xl font-mono font-bold text-emerald-400 mb-4">{formatTime(time)}</div>
                    <button onClick={stopTimer} className="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black py-4 rounded-xl text-xl">SUSTABDYTI 🛑</button>
                  </div>
                )}
                {status === 'review' && (
                  <div className="text-center py-4">
                    <div className="text-4xl font-mono font-bold text-indigo-300 mb-4">{formatTime(time)}</div>
                    <div className="flex gap-2">
                      <button onClick={confirmTimerScore} className="flex-1 bg-emerald-600 text-white font-bold py-3 rounded-xl">✅ Išsaugoti</button>
                      <button onClick={() => setStatus('idle')} className="flex-1 bg-slate-800 text-slate-300 font-bold py-3 rounded-xl">❌ Atmesti</button>
                    </div>
                  </div>
                )}
              </div>
              <button onClick={() => setShowManualModal(true)} className="w-full bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-indigo-500/30 font-bold py-3 rounded-xl">➕ Pridėti rezultatą rankiniu būdu</button>
            </div>
            <div className="md:col-span-7">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-2xl font-bold text-slate-100">🏆 Lyderių lentelė</h2>
                  <div className="flex gap-1">
                    {OCTAVES.map(o => (
                      <button key={o.id} onClick={() => setSelectedTab(o.id)} className={`px-2.5 py-1 rounded-lg text-xs font-bold ${selectedTab === o.id ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}`}>
                        {o.icon}

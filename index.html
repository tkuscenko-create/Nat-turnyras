<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Natų čempionatas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif}
body{background:#020617;color:#f1f5f9;padding:16px;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{text-align:center}
h1{font-size:1.8rem;font-weight:900;background:linear-gradient(90deg,#fcd34d,#c7d2fe,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:6px}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;background:#1e1b4b;border:1px solid #4f46e5;color:#a5b4fc;font-size:.75rem;font-weight:700}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:768px){.grid{grid-template-columns:5fr 7fr}}
.card{background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:18px}
.title{font-size:1.2rem;font-weight:800;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
label{display:block;font-size:.8rem;color:#94a3b8;margin-bottom:5px;font-weight:600}
input,select{width:100%;background:#020617;border:1px solid #334155;border-radius:10px;padding:12px;color:#fff;font-size:1rem;margin-bottom:12px}
button{border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn-go{width:100%;background:#4f46e5;color:#fff;padding:14px;font-size:1.05rem}
.btn-stop{width:100%;background:#10b981;color:#020617;padding:16px;font-size:1.2rem;font-weight:900}
.btn-rst{width:100%;background:#1e293b;color:#e2e8f0;padding:12px;margin-top:10px}
.center{text-align:center;padding:10px 0}
.cd{font-size:4.5rem;font-weight:900;color:#fbbf24;padding:12px 0}
.time{font-family:monospace;font-size:3rem;font-weight:800;color:#34d399;margin-bottom:16px}
.msg{margin-top:12px;padding:10px;border-radius:10px;font-size:.85rem;font-weight:600}
.ok{background:rgba(16,185,129,.15);border:1px solid #10b981;color:#6ee7b7}
.warn{background:rgba(245,158,11,.15);border:1px solid #f59e0b;color:#fcd34d}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:6px 10px;background:#1e293b;color:#94a3b8;font-size:.8rem}
.tab.act{background:#4f46e5;color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#020617;border:1px solid #1e293b;border-radius:12px;margin-bottom:8px}
.row.t1{border-color:#fbbf24}
.del{background:rgba(244,63,94,.15);color:#fda4af;padding:6px 9px;margin-left:8px}
.clr{background:transparent;border:1px solid #f43f5e;color:#fda4af;padding:5px 8px;font-size:.75rem}
.hid{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header><div class="badge">🎵 Muzikos pamokos žaidimas</div><h1>Natų skaitymo čempionatas</h1></header>
<div class="grid">
<div class="card">
<div class="title">⏱️ Sekundometras</div>
<form id="f1">
<label>Mokinio vardas</label><input id="nm" required placeholder="Įveskite vardą...">
<label>Oktava</label><select id="oc"><option value="didzioji">🎻 Didžioji oktava</option><option value="mazoji">🎸 Mažoji oktava</option><option value="pirmoji" selected>🎹 Pirmoji oktava</option><option value="antroji">🎺 Antroji oktava</option></select>
<button type="submit" class="btn-go">▶ Pradėti matavimą</button>
</form>
<div id="v2" class="center hid"><div style="color:#94a3b8">Pasiruoškite...</div><div class="cd" id="cdn">3</div></div>
<div id="v3" class="center hid"><div class="time" id="run">0.00 s</div><button id="stp" class="btn-stop">⏹ SUSTABDYTI</button></div>
<div id="v4" class="center hid"><div style="color:#94a3b8">Rezultatas:</div><div class="time" style="color:#a5b4fc" id="fin">0.00 s</div><button id="rst" class="btn-rst">🔄 Naujas bandymas</button></div>
<div id="fb" class="msg hid"></div>
</div>
<div class="card">
<div class="title"><span>🏆 Lyderių lentelė</span><button id="clr" class="clr hid">🗑️ Išvalyti</button></div>
<div class="tabs" id="tbs">
<button class="tab" data-o="all">🎵 Visos</button>
<button class="tab" data-o="didzioji">🎻 Didžioji</button>
<button class="tab" data-o="mazoji">🎸 Mažoji</button>
<button class="tab act" data-o="pirmoji">🎹 Pirmoji</button>
<button class="tab" data-o="antroji">🎺 Antroji</button>
</div>
<div id="lst"></div>
</div>
</div>
</div>
<script>
const O={all:'🎵 Visos',didzioji:'🎻 Didžioji',mazoji:'🎸 Mažoji',pirmoji:'🎹 Pirmoji',antroji:'🎺 Antroji'};
let R=JSON.parse(localStorage.getItem('nc_v4')||'[]'),F='pirmoji',t1,t2,st=0;
const $=id=>document.getElementById(id);
function beep(f,d=0.15){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.1,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
function fmt(m){return(m/1000).toFixed(2)+' s'}
function view(v){['f1','v2','v3','v4'].forEach(x=>$(x).classList.add('hid'));$(v).classList.remove('hid')}
function msg(t,c){$('fb').textContent=t;$('fb').className='msg '+c;$('fb').classList.remove('hid')}
$('f1').onsubmit=e=>{e.preventDefault();if(!$('nm').value.trim())return;$('fb').classList.add('hid');let c=3;$('cdn').textContent=c;view('v2');beep(440);t1=setInterval(()=>{c--;if(c>0){$('cdn').textContent=c;beep(550)}else{clearInterval(t1);beep(880,.3);view('v3');st=Date.now();t2=setInterval(()=>$('run').textContent=fmt(Date.now()-st),20)}},1000)};
$('stp').onclick=()=>{clearInterval(t2);const ms=Date.now()-st;$('fin').textContent=fmt(ms);view('v4');beep(523,.25);save($('nm').value.trim(),$('oc').value,ms)};
$('rst').onclick=()=>{$('fb').classList.add('hid');view('f1')};
function save(n,o,ms){const ex=R.find(r=>r.n.toLowerCase()===n.toLowerCase()&&r.o===o);if(ex){if(ms>=ex.ms){msg('⚠️ Greitesnis rekordas jau yra ('+fmt(ex.ms)+')','warn');return}ex.df=ex.ms-ms;ex.ms=ms;msg('🎉 Rekordas pagerintas -'+fmt(ex.df),'ok')}else{R.push({id:Date.now()+'',n,o,ms,df:0});msg('✅ '+n+' įtrauktas į lentelę!','ok')}localStorage.setItem('nc_v4',JSON.stringify(R));tab(o)}
function tab(o){F=o;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('act',b.dataset.o===o));draw()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.o));
$('clr').onclick=()=>{if(confirm('Ištrinti viską?')){R=[];localStorage.removeItem('nc_v4');draw()}};
window.del=id=>{R=R.filter(r=>r.id!==id);localStorage.setItem('nc_v4',JSON.stringify(R));draw()};
function draw(){$('clr').classList.toggle('hid',!R.length);const l=R.filter(r=>F==='all'||r.o===F).sort((a,b)=>a.ms-b.ms);$('lst').innerHTML=l.length?l.map((r,i)=>`<div class="row ${i===0?'t1':''}"><div><b>${i<3?['🥇','🥈','🥉'][i]:'#'+(i+1)} ${r.n}</b><div style="font-size:.75rem;color:#94a3b8">${O[r.o]}</div></div><div style="display:flex;align-items:center"><div style="text-align:right"><b style="color:#a5b4fc;font-family:monospace;font-size:1.15rem">${fmt(r.ms)}</b>${r.df?`<div style="font-size:.7rem;color:#34d399">-${fmt(r.df)}</div>`:''}</div><button class="del" onclick="del('${r.id}')">✕</button></div></div>`).join(''):'<div style="text-align:center;color:#94a3b8;padding:20px">Rezultatų dar nėra 🎵</div>'}
draw();
</script>
</body>
</html>

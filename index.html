<!DOCTYPE html><html lang="lt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Natų skaitymo čempionatas</title><script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-slate-100 min-h-screen font-sans"><div id="root"></div><script type="text/babel">
const {useState,useEffect,useRef}=React;
const OCTAVES=[{id:'all',name:'Visos oktavos',icon:'🎵'},{id:'didzioji',name:'Didžioji oktava',icon:'🎻'},{id:'mazoji',name:'Mažoji oktava',icon:'🎸'},{id:'pirmoji',name:'Pirmoji oktava',icon:'🎹'},{id:'antroji',name:'Antroji oktava',icon:'🎺'}];
const playSound=(f,t='sine',d=0.15)=>{try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(0.12,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}};
function App(){
const [records,setRecords]=useState(()=>{try{const s=localStorage.getItem('notes_rec_v7');return s?JSON.parse(s):[]}catch(e){return []}});
const [studentName,setStudentName]=useState('');
const [selectedOctave,setSelectedOctave]=useState('pirmoji');
const [filterOctave,setFilterOctave]=useState('pirmoji');
const [gameState,setGameState]=useState('idle');
const [countdown,setCountdown]=useState(3);
const [time,setTime]=useState(0);
const [lastRecordedTime,setLastRecordedTime]=useState(null);
const [showManualModal,setShowManualModal]=useState(false);
const [manualName,setManualName]=useState('');
const [manualOctave,setManualOctave]=useState('pirmoji');
const [manualSeconds,setManualSeconds]=useState('');
const [editingId,setEditingId]=useState(null);
const [editName,setEditName]=useState('');
const [editOctave,setEditOctave]=useState('pirmoji');
const [editSeconds,setEditSeconds]=useState('');
const timerRef=useRef(null),startTimeRef=useRef(null);
useEffect(()=>{try{localStorage.setItem('notes_rec_v7',JSON.stringify(records))}catch(e){}},[records]);
useEffect(()=>{let i=null;if(gameState==='countdown'){if(countdown>0){playSound(440+(3-countdown)*110);i=setInterval(()=>setCountdown(c=>c-1),1000)}else{playSound(880,'triangle',0.3);setGameState('running');startTimeRef.current=Date.now();timerRef.current=setInterval(()=>setTime(Date.now()-startTimeRef.current),10)}}return ()=>clearInterval(i)},[gameState,countdown]);
const handleStartTimer=(e)=>{e.preventDefault();if(!studentName.trim())return;setTime(0);setLastRecordedTime(null);setCountdown(3);setGameState('countdown')};
const handleStopTimer=()=>{clearInterval(timerRef.current);const f=Date.now()-startTimeRef.current;setTime(f);setLastRecordedTime(f);setGameState('review');playSound(523.25,'sine',0.25)};
const confirmTimerRecord=()=>{saveOrUpdateRecord(studentName.trim(),selectedOctave,lastRecordedTime);setGameState('idle');setTime(0)};
const getOctaveRanks=(all,oct)=>{const items=all.filter(r=>r.octave===oct).sort((a,b)=>a.time-b.time);const m={};items.forEach((item,idx)=>{m[item.id]=idx+1});return m};
const saveOrUpdateRecord=(name,octave,newTime,customEditId=null)=>{
const targetEditId=customEditId||editingId;
const oldRanks=getOctaveRanks(records,octave);
const filtered=records.filter(r=>r.id!==targetEditId);
const existing=filtered.find(r=>r.name.toLowerCase()===name.toLowerCase()&&r.octave===octave);
if(existing&&!targetEditId){
if(newTime>=existing.time){alert(`Ankstesnis ${name} rekordas (${formatTime(existing.time)}) buvo greitesnis!`);return}
const diffMs=existing.time-newTime;
const prevRank=oldRanks[existing.id];
setRecords(records.map(r=>r.id===existing.id?{...r,time:newTime,date:new Date().toLocaleDateString('lt-LT'),timeDiffMs:diffMs,previousRank:prevRank}:r))
}else{
const diffMs=existing?existing.time-newTime:null;
const prevRank=existing?oldRanks[existing.id]:null;
const newRecord={id:targetEditId||Date.now().toString(),name,octave,time:newTime,date:new Date().toLocaleDateString('lt-LT'),previousRank:prevRank,timeDiffMs:diffMs};
setRecords([...filtered.filter(r=>!(r.name.toLowerCase()===name.toLowerCase()&&r.octave===octave)),newRecord])
}
setFilterOctave(octave);
};
const handleDeleteRecord=(id)=>{if(confirm('Ištrinti šį įrašą?'))setRecords(records.filter(r=>r.id!==id))};
const handleClearAll=()=>{if(confirm('Ištrinti visus rezultatus?')){setRecords([]);localStorage.removeItem('notes_rec_v7')}};
const formatTime=(ms)=>{if(ms===null||ms===undefined)return '0.00 s';const s=Math.floor(ms/1000),h=Math.floor((ms%1000)/10);return `${s}.${h<10?'0':''}${h} s`};
const currentFilteredRecords=records.filter(r=>filterOctave==='all'||r.octave===filterOctave).sort((a,b)=>a.time-b.time);
const top3=currentFilteredRecords.slice(0,3);
const rest=currentFilteredRecords.slice(3);
return (
<div className="max-w-4xl mx-auto px-4 py-6">
<h1 className="text-3xl font-black text-center mb-6 text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-indigo-200 to-emerald-400">Natų skaitymo čempionatas</h1>
<div className="grid grid-cols-1 md:grid-cols-12 gap-6">
<div className="md:col-span-5 flex flex-col gap-4">
<div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
<h2 className="text-lg font-bold mb-3">⏱️ Sekundometras</h2>
{gameState==='idle'&&(
<form onSubmit={handleStartTimer} className="space-y-3">
<input type="text" required placeholder="Mokinio vardas" value={studentName} onChange={e=>setStudentName(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm" />
<div className="grid grid-cols-2 gap-1.5">
{OCTAVES.filter(o=>o.id!=='all').map(o=>(
<button key={o.id} type="button" onClick={()=>setSelectedOctave(o.id)} className={`p-2 rounded-lg text-xs font-semibold border ${selectedOctave===o.id?'bg-indigo-600 border-indigo-500':'bg-slate-950 border-slate-800 text-slate-400'}`}>{o.icon} {o.name}</button>
))}
</div>
<button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl">Pradėti 🚀</button>
</form>
)}
{gameState==='countdown'&&<div className="text-center py-6 text-6xl font-black text-amber-400">{countdown}</div>}
{gameState==='running'&&(
<div className="text-center py-4">
<div className="text-5xl font-mono font-bold text-emerald-400 mb-4">{formatTime(time)}</div>
<button onClick={handleStopTimer} className="w-full bg-rose-600 text-white font-black py-3.5 rounded-xl text-lg">SUSTABDYTI 🛑</button>
</div>
)}
{gameState==='review'&&(
<div className="text-center py-3 space-y-3">
<div className="text-4xl font-mono font-bold text-indigo-300">{formatTime(lastRecordedTime)}</div>
<div className="flex gap-2">
<button onClick={confirmTimerRecord} className="flex-1 bg-emerald-600 font-bold py-2.5 rounded-xl">✅ Išsaugoti</button>
<button onClick={()=>setGameState('idle')} className="flex-1 bg-slate-800 font-bold py-2.5 rounded-xl">❌ Atmesti</button>
</div>
</div>
)}
</div>
<button onClick={()=>setShowManualModal(true)} className="w-full bg-slate-900 border border-indigo-500/30 text-indigo-300 font-bold py-3 rounded-xl text-sm">➕ Pridėti rankiniu būdu</button>
</div>
<div className="md:col-span-7">
<div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
<div className="flex justify-between items-center mb-4">
<h2 className="text-xl font-bold">🏆 Lyderių lentelė</h2>
{records.length>0&&<button onClick={handleClearAll} className="text-xs text-rose-400">Valyti viską</button>}
</div>
<div className="flex flex-wrap gap-1 mb-4">
{OCTAVES.map(o=>(
<button key={o.id} onClick={()=>setFilterOctave(o.id)} className={`px-2.5 py-1 rounded-lg text-xs font-semibold ${filterOctave===o.id?'bg-indigo-600 text-white':'bg-slate-800 text-slate-400'}`}>{o.icon} {o.name}</button>
))}
</div>
<div className="space-y-2">
{top3.map((record,index)=>{
const rank=index+1,rankDiff=record.previousRank?record.previousRank-rank:0;
return (
<div key={record.id} className="flex items-center justify-between p-3 rounded-xl bg-slate-950 border border-amber-500/30">
<div className="flex items-center gap-3">
<span className="text-2xl">{rank===1?'🥇':rank===2?'🥈':'🥉'}</span>
<div><div className="font-extrabold text-lg">{record.name}</div><div className="text-xs text-slate-400">{record.date}</div></div>
</div>
<div className="flex items-center gap-2">
<div className="text-right">
<div className="font-mono font-bold text-indigo-300 text-lg">{formatTime(record.time)}</div>
{rankDiff>0&&<div className="text-xs font-bold text-emerald-400">▲ +{rankDiff} vieta</div>}
{rankDiff<0&&<div className="text-xs font-bold text-rose-400">▼ {rankDiff} vieta</div>}
{record.timeDiffMs&&<div className="text-xs font-bold text-emerald-400">-{(record.timeDiffMs/1000).toFixed(2)}s greičiau</div>}
</div>
<button onClick={()=>{setEditingId(record.id);setEditName(record.name);setEditOctave(record.octave);setEditSeconds((record.time/1000).toString())}} className="text-slate-500">✏️</button>
<button onClick={()=>handleDeleteRecord(record.id)} className="text-slate-500">🗑️</button>
</div>
</div>
)
})}
{rest.map((record,index)=>{
const rank=index+4,rankDiff=record.previousRank?record.previousRank-rank:0;
return (
<div key={record.id} className="flex items-center justify-between p-2.5 rounded-xl bg-slate-950/60 border border-slate-800">
<div className="flex items-center gap-2"><span className="font-bold text-slate-500">#{rank}</span><span className="font-bold">{record.name}</span></div>
<div className="flex items-center gap-2">
<div className="text-right"><div className="font-mono font-bold text-indigo-300">{formatTime(record.time)}</div></div>
<button onClick={()=>{setEditingId(record.id);setEditName(record.name);setEditOctave(record.octave);setEditSeconds((record.time/1000).toString())}} className="text-slate-500">✏️</button>
<button onClick={()=>handleDeleteRecord(record.id)} className="text-slate-500">🗑️</button>
</div>
</div>
)
})}
</div>
</div>
</div>
</div>
{showManualModal&&(
<div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
<div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-sm w-full space-y-3">
<h3 className="font-bold text-lg">Pridėti rezultatą</h3>
<input type="text" placeholder="Vardas" value={manualName} onChange={e=>setManualName(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm" />
<select value={manualOctave} onChange={e=>setManualOctave(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm">
{OCTAVES.filter(o=>o.id!=='all').map(o=><option key={o.id} value={o.id}>{o.name}</option>)}
</select>
<input type="number" step="0.01" placeholder="Laikas sekundėmis (pvz. 12.45)" value={manualSeconds} onChange={e=>setManualSeconds(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm" />
<div className="flex gap-2">
<button onClick={()=>{if(manualName&&manualSeconds){saveOrUpdateRecord(manualName.trim(),manualOctave,parseFloat(manualSeconds)*1000);setShowManualModal(false);setManualName('');setManualSeconds('')}}} className="flex-1 bg-indigo-600 font-bold py-2 rounded-xl text-sm">Išsaugoti</button>
<button onClick={()=>setShowManualModal(false)} className="flex-1 bg-slate-800 font-bold py-2 rounded-xl text-sm">Atšaukti</button>
</div>
</div>
</div>
)}
{editingId&&(
<div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
<div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-sm w-full space-y-3">
<h3 className="font-bold text-lg">Redaguoti įrašą</h3>
<input type="text" value={editName} onChange={e=>setEditName(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm" />
<select value={editOctave} onChange={e=>setEditOctave(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm">
{OCTAVES.filter(o=>o.id!=='all').map(o=><option key={o.id} value={o.id}>{o.name}</option>)}
</select>
<input type="number" step="0.01" value={editSeconds} onChange={e=>setEditSeconds(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm" />
<div className="flex gap-2">
<button onClick={()=>{if(editName&&editSeconds){saveOrUpdateRecord(editName.trim(),editOctave,parseFloat(editSeconds)*1000,editingId);setEditingId(null)}}} className="flex-1 bg-indigo-600 font-bold py-2 rounded-xl text-sm">Atnaujinti</button>
<button onClick={()=>setEditingId(null)} className="flex-1 bg-slate-800 font-bold py-2 rounded-xl text-sm">Atšaukti</button>
</div>
</div>
</div>
)}
</div>
)
}
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script></body></html>

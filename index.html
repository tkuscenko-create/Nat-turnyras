<!DOCTYPE html><html lang="lt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vaikų greičio rekordai</title><style>
*{box-sizing:border-box}
body{background:#090d16;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:12px}
.app{max-width:500px;margin:0 auto}
.header-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.app-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;color:#fff}
.icon-box{background:#4f46e5;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.top-actions{display:flex;gap:6px}
.icon-btn{background:#1e293b;border:1px solid #334155;color:#94a3b8;padding:8px 12px;border-radius:10px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:600}
.card{background:#111827;border:1px solid #1f2937;border-radius:20px;padding:16px;margin-bottom:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-title{font-size:14px;font-weight:700;color:#f1f5f9}
.sub-text{font-size:11px;color:#6b7280}
.label{font-size:11px;font-weight:800;color:#94a3b8;text-transform:uppercase;margin-bottom:6px;display:block}
input,select{width:100%;background:#030712;border:1px solid #1f2937;color:#fff;padding:12px;border-radius:12px;font-size:14px;margin-bottom:10px;outline:none}
input:focus{border-color:#6366f1}
.quick-names{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.q-name-btn{background:#1e293b;border:1px solid #334155;color:#cbd5e1;padding:6px 12px;border-radius:16px;font-size:12px;cursor:pointer}
.q-name-btn:hover{background:#334155}
.oct-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.oct-card{background:#030712;border:1px solid #1f2937;border-radius:14px;padding:12px;cursor:pointer;position:relative}
.oct-card.active{border-color:#4f46e5;background:#1e1b4b}
.oct-top{display:flex;justify-content:space-between;align-items:flex-start}
.oct-name{font-size:13px;font-weight:700;color:#fff}
.clef-badge{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;display:flex;align-items:center;gap:3px}
.boso{background:#064e3b;color:#34d399}
.smuiko{background:#831843;color:#f472b6}
.oct-notes{font-size:10px;color:#6b7280;margin-top:6px;letter-spacing:0.5px}
.btn{width:100%;background:#4f46e5;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
.btn-stop{background:#dc2626;font-size:18px;padding:16px}
.btn-save{background:#059669;margin-top:10px}
.timer-box{text-align:center;padding:10px 0}
.time-val{font-size:48px;font-family:monospace;font-weight:800;color:#fff;letter-spacing:-1px}
.place-card{background:#030712;border:1px solid #1f2937;border-radius:16px;padding:14px;margin-bottom:12px;text-align:center;position:relative}
.place-1{border-color:#d97706;background:linear-gradient(180deg, #2e1065 0%, #030712 100%)}
.place-2{border-color:#334155}
.place-3{border-color:#78350f}
.place-tag{display:inline-flex;align-items:center;gap:4px;
function startSequence(e){if(e)e.preventDefault();if(!studentName.trim())return;time=0;countdown=3;gameState='countdown';render();runCountdown();}
function runCountdown(){
if(countdown>0){playBeep(523.25,'square',0.2,0.4);setTimeout(()=>{countdown--;render();runCountdown();},1000);}
else{playBeep(1046.50,'sawtooth',0.5,0.5);gameState='running';startTimeRef=Date.now();timerRef=setInterval(()=>{time=Date.now()-startTimeRef;renderTime();},10);render();}
}
function stopTimer(){clearInterval(timerRef);const finalTime=Date.now()-startTimeRef;time=finalTime;gameState='review';playBeep(659.25,'sine',0.3,0.4);render();}
function confirmRecord(){saveOrUpdate(studentName.trim(),selectedOctave,time,customNote);gameState='idle';customNote='';render();}
function saveOrUpdate(name,octave,newTime,note=''){
const now=new Date();
const dateStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
const existingList=records.filter(r=>r.octave===octave&&r.name.toLowerCase()===name.toLowerCase());
let diffMs=null;
if(existingList.length>0){
const bestTime=Math.min(...existingList.map(r=>r.time));
diffMs=newTime-bestTime;
}
records.push({id:Date.now().toString(),name,octave,time:newTime,date:dateStr,diffMs,note});
filterOctave=octave;saveRecords();
}
function renderTime(){const el=document.getElementById('live-time');if(el)el.innerText=formatTime(time);}
function setFilterMode(m){filterMode=m;render();}
function render(){
document.getElementById('tab-best').className=`tab-btn ${filterMode==='best'?'active':''}`;
document.getElementById('tab-all').className=`tab-btn ${filterMode==='all'?'active':''}`;
const tc=document.getElementById('timer-card');
const names=getUniqueNames();
const octObj=OCTAVES.find(o=>o.id===selectedOctave);
if(gameState==='idle'){
tc.innerHTML=`<div class="card-head"><div><div class="card-title">⏱️ Laikmatis ir naujo rekordo fiksavimas</div><div class="sub-text">Pasirinkite oktavą, įveskite vaiko vardą ir paleiskite laikmatį</div></div>
<button class="icon-btn" onclick="openManualModal()">+ Ranka</button></div>
<form onsubmit="startSequence(event)">
<span class="label">VAIKO VARDAS *</span>
<input type="text" required placeholder="Įrašykite vaiko vardą (pvz., Emilija)..." value="${studentName}" oninput="studentName=this.value" />
${names.length>0?`<div style="font-size:11px;color:#94a3b8;margin-bottom:6px">Greitas pasirinkimas:</div><div class="quick-names">${names.map(n=>`<button type="button" class="q-name-btn" onclick="studentName='${n}';render()">${n}</button>`).join('')}</div>`:''}
<span class="label">OKTAVOS KATEGORIJA (4 RŪŠYS)</span>
<div class="oct-grid">${OCTAVES.map(o=>`<div class="oct-card ${selectedOctave===o.id?'active':''}" onclick="selectedOctave='${o.id}';render()"><div class="oct-top"><span class="oct-name">${o.name}</span><span class="clef-badge ${o.bClass}">${o.clefIcon} ${o.badge}</span></div><div class="sub-text">${o.sub}</div><div class="oct-notes">${o.notes}</div></div>`).join('')}</div>
<label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#94a3b8;margin-bottom:12px;cursor:pointer"><input type="checkbox" ${soundEnabled?'checked':''} onchange="soundEnabled=this.checked" style="width:auto;margin:0" /> 3-2-1 pradžios atgalinis skaičiavimas su garsu</label>
<button type="submit" class="btn">► Pradėti</button></form>`;
}else if(gameState==='countdown'){
tc.innerHTML=`<div class="timer-box"><div style="font-size:12px;color:#818cf8;font-weight:700">${octObj.name.toUpperCase()} • ${studentName.toUpperCase()}</div><div style="font-size:72px;font-weight:900;color:#fbbf24;margin:10px 0">${countdown>0?countdown:'PIRMYN!'}</div><div style="color:#94a3b8;font-size:12px">Paspauskite „Pradėti“, kad paleistumėte laikmatį</div></div>`;
}else if(gameState==='running'){
tc.innerHTML=`<div class="timer-box"><div style="font-size:12px;color:#818cf8;font-weight:700">${octObj.name.toUpperCase()} • ${studentName.toUpperCase()}</div><div id="live-time" class="time-val" style="margin:10px 0">${formatTime(time)}</div><button onclick="stopTimer()" class="btn btn-stop">■ SUSTABDYTI</button></div>`;
}else if(gameState==='review'){
tc.innerHTML=`<div class="timer-box"><div style="font-size:12px;color:#818cf8;font-weight:700">${octObj.name.toUpperCase()} • ${studentName.toUpperCase()}</div><div class="time-val" style="margin:10px 0">${formatTime(time)}</div><div style="font-size:13px;color:#fbbf24;margin-bottom:10px">${formatSec(time)}</div><input type="text" placeholder="Papildoma pastaba (pvz., be klaidų)..." value="${customNote}" oninput="customNote=this.value" /><div style="display:flex;gap:8px"><button onclick="confirmRecord()" class="btn btn-save">✨ Išsaugoti rekordą!</button><button onclick="gameState='idle';render()" class="btn" style="background:#374151">🔄 Iš naujo</button></div></div>`;
}
document.getElementById('oct-filter').innerHTML=OCTAVES.map(o=>`<option value="${o.id}" ${filterOctave===o.id?'selected':''}>${o.clefIcon} ${o.name}</option>`).join('');
let filtered=records.filter(r=>r.octave===filterOctave);
if(filterMode==='best'){
const bestMap={};
filtered.forEach(r=>{
if(!bestMap[r.name.toLowerCase()]||r.time<bestMap[r.name.toLowerCase()].time){bestMap[r.name.toLowerCase()]=r;}
});
filtered=Object.values(bestMap);
}
filtered.sort((a,b)=>a.time-b.time);
let html='';
if(filtered.length===0){
html='<div style="text-align:center;color:#6b7280;padding:24px;font-size:13px">Šioje oktavoje dar nėra įrašytų rezultatų.</div>';
}else{
html=filtered.map((r,i)=>{
const rank=i+1;
let placeClass=rank===1?'place-1':rank===2?'place-2':rank===3?'place-3':'';
let tagClass=rank===1?'tag-1':rank===2?'tag-2':rank===3?'tag-3':'';
let medal=rank===1?'🏅 1 VIETA (AUKSAS)':rank===2?'🥈 2 VIETA':rank===3?'🥉 3 VIETA':`#${rank} VIETA`;
const octObj=OCTAVES.find(o=>o.id===r.octave);
return `<div class="place-card ${placeClass}"><div class="place-tag ${tagClass}">${medal}</div><div class="p-name">${r.name}</div><div class="p-oct-badge">${octObj?octObj.name:''}</div><div class="p-time">${formatTime(r.time)}</div><div style="font-size:13px;color:#fbbf24;font-weight:700">${formatSec(r.time)}</div>${r.diffMs!=null?`<div class="p-diff ${r.diffMs>0?'diff-plus':'diff-minus'}">${r.diffMs>0?'+':''}${formatSec(r.diffMs)}</div>`:''}<div class="p-date">📅 ${r.date} ${r.note?`• <i>${r.note}</i>`:''}</div></div>`;
}).join('');
}
document.getElementById('records-list').innerHTML=html;
}
function clearAll(){if(confirm('Ar tikrai norite ištrinti visus rezultatus?')){records=[];saveRecords();}}
function openHistoryModal(){
const names=getUniqueNames();
let html=`<div class="modal"><div class="modal-box"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3 style="margin:0">Mokinių istorija</h3><button onclick="closeModal()" style="background:none;border:none;color:#94a3b8;font-size:18px;cursor:pointer">✕</button></div>`;
if(records.length===0){html+='<div style="color:#6b7280;font-size:13px">Istorija tuščia.</div>';}
else{
html+=`<div style="max-height:300px;overflow-y:auto">${records.slice().reverse().map(r=>`<div style="background:#030712;padding:10px;border-radius:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center"><div><strong>${r.name}</strong> (${r.octave})<div style="font-size:11px;color:#94a3b8">${formatTime(r.time)} • ${r.date}</div></div><button onclick="deleteRecord('${r.id}')" style="background:none;border:none;color:#ef4444;cursor:pointer">🗑️</button></div>`).join('')}</div>`;
}
html+=`<button onclick="closeModal()" class="btn" style="margin-top:14px">Uždaryti</button></div></div>`;
document.getElementById('modal-container').innerHTML=html;
}
function deleteRecord(id){records=records.filter(r=>r.id!==id);saveRecords();openHistoryModal();}
function openManualModal(){
document.getElementById('modal-container').innerHTML=`<div class="modal"><div class="modal-box"><h3 style="margin-top:0">Pridėti rezultatą rankiniu būdu</h3><input id="m-name" type="text" placeholder="Vaiko vardas" /><select id="m-oct">${OCTAVES.map(o=>`<option value="${o.id}">${o.clefIcon} ${o.name}</option>`).join('')}</select><input id="m-sec" type="number" step="0.01" placeholder="Laikas sekundėmis (pvz. 4.06)" /><input id="m-note" type="text" placeholder="Pastaba (pasirinktinai)" /><div style="display:flex;gap:8px"><button onclick="submitManual()" class="btn btn-save">Išsaugoti</button><button onclick="closeModal()" class="btn" style="background:#374151">Atšaukti</button></div></div></div>`;
}
function submitManual(){const n=document.getElementById('m-name').value,o=document.getElementById('m-oct').value,s=document.getElementById('m-sec').value,nt=document.getElementById('m-note').value;if(n&&s){saveOrUpdate(n.trim(),o,parseFloat(s)*1000,nt);closeModal();}}
function closeModal(){document.getElementById('modal-container').innerHTML='';}
render();
</script></body></html>
